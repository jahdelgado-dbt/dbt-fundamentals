models:
  - name: fct_orders
    semantic_model:
      enabled: true
      name: finance_orders
    description: "Order-level finance facts with successful payment amounts. Grain is one order per row."
    agg_time_dimension: order_date
    columns:
      - name: order_id
        entity:
          type: primary
          name: orders
      - name: customer_id
        entity:
          type: foreign
          name: customer
      - name: order_date
        dimension:
          type: time
        granularity: day
      - name: order_status
        dimension:
          type: categorical
    metrics:
      - name: revenue
        label: "Revenue"
        description: "Total paid revenue from successful payments"
        type: simple
        agg: sum
        expr: amount
      - name: paid_order_count
        label: "Paid Order Count"
        description: "Total number of orders with finance facts"
        type: simple
        agg: count_distinct
        expr: order_id
      - name: order_count
        label: "Order Count"
        description: "Total number of orders placed"
        type: simple
        agg: count_distinct
        expr: order_id
      - name: completed_orders
        label: "Completed Orders"
        description: "Count of orders with status = completed"
        type: simple
        filter: |
          {{ Dimension('orders__order_status') }} = 'completed'
        agg: count_distinct
        expr: order_id
      - name: returned_orders
        label: "Returned Orders"
        description: "Count of orders with status = returned"
        type: simple
        filter: |
          {{ Dimension('orders__order_status') }} = 'returned'
        agg: count_distinct
        expr: order_id
      - name: return_rate
        label: "Return Rate"
        description: "Percentage of orders that were returned"
        type: ratio
        numerator: returned_orders
        denominator: order_count
      - name: average_order_value
        label: "Average Order Value"
        description: "Average paid revenue per order"
        type: ratio
        numerator: revenue
        denominator: paid_order_count
      - name: order_count_change_7d
        label: "7-Day Order Count Change"
        description: "Change in order count compared to 7 days ago"
        type: derived
        expr: order_count - order_count_7d_ago
        input_metrics:
          - name: order_count
          - name: order_count
            alias: order_count_7d_ago
            offset_window: 7 days
